name: Build & Release Android

# Builds the release Android APK + AAB and publishes them to GitHub Releases.
#  • Push a tag like v1.0.0           → release named after the tag
#  • Run manually (Actions ▸ Run)     → release "build-<run number>" (or a tag you type)
# The APK/AAB are also uploaded as a build artifact on every run. (Web is built locally,
# not in CI. iOS has its own workflow — see ios.yml.)
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   • KEYSTORE_BASE64   — the release upload keystore (.jks), base64-encoded.
#   • KEYSTORE_PASSWORD — keystore (store) password.
#   • KEY_PASSWORD       — key password.
#   • KEY_ALIAS          — alias of the key inside the keystore.
# Without these, the workflow still builds, but DEBUG-SIGNED (sideload-only, and
# Play Store will reject it). That path is now explicit rather than silent: the
# "Decide signing identity" step below sets ALLOW_DEBUG_SIGNED_RELEASE and emits
# a run annotation, and the published release names itself debug-signed. A local
# build without android/key.properties fails outright instead — there is no CI
# annotation to read on a laptop.
on:
  # Manual only. A `v*` tag used to build and publish a release automatically;
  # a tag is easy to push by reflex, and a release is not something to trigger
  # by reflex. Run it deliberately from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.0.0). Leave blank for build-<run>.'
        required: false
        default: ''

permissions:
  contents: write # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release-strength gates. GATES_RELEASE promotes PROVISIONAL values from a
      # warning to a hard failure, so a back-derived fee rate or any other
      # unconfirmed number cannot be shipped by tagging a release. Everything
      # else in the gate set is already enforced on every push by gates.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gates (release strength)
        env:
          GATES_RELEASE: '1'
        run: python3 scripts/gates/run.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the SDK this project was built with (Dart 3.12.2 → pubspec sdk ^3.12.2).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Runs unconditionally, and decides the signing identity out loud.
      #
      # This used to be `if: env.KEYSTORE_BASE64 != ''`, so with no secret the
      # step simply vanished and Gradle quietly fell back to Android's debug
      # keys -- a debug-signed .apk with a release filename, indistinguishable
      # from the real thing until Play rejects it. The Gradle script now refuses
      # that fallback unless it is asked for explicitly, so this step has to say
      # which build it is producing rather than leave it to be inferred.
      - name: Decide signing identity
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Consumed by android/app/build.gradle.kts: opts in to debug signing
            # and makes Gradle print its own loud warning too.
            echo "ALLOW_DEBUG_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed build::No KEYSTORE_BASE64 secret is set, so this run produces a DEBUG-SIGNED apk/aab. It is sideload-only and Play Store will reject it. Set the four signing secrets to cut a real release."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded - this is a real, upload-signed build."
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://alpha.kudimatasecurities.com

      - name: Build release AAB (Play Store upload format)
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://alpha.kudimatasecurities.com

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Stage artifacts
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # A debug-signed artifact says so in its own filename. Someone finds
          # these on a Releases page months later with no run log next to them,
          # and "release" in the name is the only thing they will read.
          if [ "$SIGNED" != "true" ]; then TAG="${TAG}-debugsigned"; fi
          echo "ARTIFACT_TAG=${TAG}" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/kudimata-securities-${TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/kudimata-securities-${TAG}.aab"

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: kudimata-securities-android-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Kudimata Securities ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            Android release build for Kudimata Securities.

            ${{ steps.signing.outputs.signed == 'true'
              && 'Signed with the release upload keystore. The .aab can be uploaded to Play Store.'
              || '**DEBUG-SIGNED — not a real release.** No signing keystore was available to this run, so these were signed with Android''s debug key. Sideload only: Play Store will reject the .aab, and this cannot update an installed store build. Set the four signing secrets and re-run to cut a real release.' }}

            • `kudimata-securities-${{ env.ARTIFACT_TAG }}.apk` — sideload on Android
            • `kudimata-securities-${{ env.ARTIFACT_TAG }}.aab` — Play Store upload format
