name: Build & Release Android

# Builds the release Android APK + AAB and publishes them to GitHub Releases.
#  • Push a tag like v1.0.0           → release named after the tag
#  • Run manually (Actions ▸ Run)     → release "build-<run number>" (or a tag you type)
# The APK/AAB are also uploaded as a build artifact on every run. (Web is built locally,
# not in CI. iOS has its own workflow — see ios.yml.)
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   • KEYSTORE_BASE64   — the release upload keystore (.jks), base64-encoded.
#   • KEYSTORE_PASSWORD — keystore (store) password.
#   • KEY_PASSWORD       — key password.
#   • KEY_ALIAS          — alias of the key inside the keystore.
# Without these, the workflow falls back to Android's debug keys (sideload-only,
# not accepted by Play Store) — same as local builds without android/key.properties.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.0.0). Leave blank for build-<run>.'
        required: false
        default: ''

permissions:
  contents: write # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the SDK this project was built with (Dart 3.12.2 → pubspec sdk ^3.12.2).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://kudimata-securities-backend-production.up.railway.app

      - name: Build release AAB (Play Store upload format)
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://kudimata-securities-backend-production.up.railway.app

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Stage artifacts
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/kudimata-securities-${TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/kudimata-securities-${TAG}.aab"

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: kudimata-securities-android-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Kudimata Securities ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            Android release build for Kudimata Securities.

            • `kudimata-securities-${{ steps.meta.outputs.tag }}.apk` — sideload on Android
            • `kudimata-securities-${{ steps.meta.outputs.tag }}.aab` — Play Store upload
